name: fastoma-0.5.1-pipeline
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Python 3.12 builds resolved on 2026-09-01 required glibc >=2.28;
  # the benchmark cluster provides glibc 2.17. FastOMA 0.5.1 supports 3.8-3.12.
  - python=3.10
  - pip
  - biopython=1.81
  - ete3=3.1.3
  - lxml<6
  - numpy<2
  - omamer=2.1.2
  - pyham=1.1.11
  - mafft=7.526
  - fasttree=2.2.0
  - nextflow=24.10.5
  - papermill
  - seaborn
  - matplotlib
  - pyparsing
  - networkx
  - jupyter
  - mmseqs2=18.8cc5c
