[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ogprofiler"
version = "2.0.0a1"
description = "Hierarchical protein family inference from sequence similarity networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "igraph>=0.11",
  "leidenalg>=0.10",
  "psutil>=5.9",
  "pyarrow>=15",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
  "types-PyYAML>=6",
]

[project.scripts]
ogprofiler = "ogprofiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["OGProfiler.py", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ogprofiler"]

[[tool.mypy.overrides]]
module = ["igraph", "leidenalg", "psutil", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
